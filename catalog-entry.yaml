name: spotify-statusbar
repo: https://github.com/KKaramaligkas/hermes-spotify-statusbar
sha: faa1b3f06568f41e475342aa6eb018de8300ccdf
description: 'Spotify player in the Hermes desktop status bar: play/pause, next, previous
  and live progress. Needs NO Spotify developer app or OAuth — on Windows it drives the
  Spotify desktop app through the OS media-session API, so having Spotify open is the
  whole setup. When `hermes auth spotify` is connected it uses the richer Web API path
  and adds artwork, device name and volume. Renders nothing at all with no player present.'
