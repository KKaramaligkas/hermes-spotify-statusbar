name: spotify-statusbar
version: 1.1.0
description: "Spotify player for the Hermes desktop status bar: play/pause, next, previous, live progress and volume. Ships a dashboard/plugin_api.py (GET /now, POST /command) that reuses the bundled Spotify client, plus a desktop/plugin.js status-bar contribution. Requires `hermes auth spotify`."
author: KKaramaligkas
kind: backend
requires_hermes: ">=0.21.0"
